services:
  meteor-app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000" # Only expose app port, NOT database port
    environment:
      ROOT_URL: "http://localhost:3000"
      MONGO_APP_USER: "refract_user"
      MONGO_APP_PASS: "refract_pass"
      # MongoDB connection via internal Docker network only
      MONGO_URL: "mongodb://refract_user:refract_pass@mongo:27017/refract?authSource=admin&directConnection=true&serverSelectionTimeoutMS=30000&connectTimeoutMS=30000"
    volumes:
      # For local dev only - remove these volumes for production VPS deployment
      - .:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - refract-internal

  mongo:
    image: mongo:5.0
    restart: unless-stopped
    # NO ports section = MongoDB not exposed to host or internet
    # Only accessible via internal Docker network
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_pass
      MONGO_APP_USER: "refract_user"
      MONGO_APP_PASS: "refract_pass"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - refract-internal

networks:
  refract-internal:
    driver: bridge
    internal: false # Set to true for completely isolated network (no internet access for containers)

volumes:
  mongo_data:
