services:
  meteor-app:
    build: .
    restart: "no"
    ports:
      - "3000:3000" # Only expose app port, NOT database port
    environment:
      ROOT_URL: "http://localhost:3000"
      MONGO_APP_USER: "refract_user"
      MONGO_APP_PASS: "refract_pass"
      # Meteor cold start/build can be memory intensive; override if needed
      NODE_OPTIONS: "${NODE_OPTIONS:---max-old-space-size=2048}"
      METEOR_ALLOW_SUPERUSER: "1"
      METEOR_EXCLUDE_ARCHS: "${METEOR_EXCLUDE_ARCHS:-web.browser.legacy,web.cordova}"
      # Repo/build info (optional) - supply via .env or export before running
      GIT_COMMIT: "${GIT_COMMIT:-}"
      GIT_BRANCH: "${GIT_BRANCH:-}"
      GIT_REPO: "${GIT_REPO:-}"
      # GitHub-compatible names (CI may set these)
      GITHUB_SHA: "${GITHUB_SHA:-}"
      GITHUB_REF_NAME: "${GITHUB_REF_NAME:-}"
      GITHUB_REPOSITORY: "${GITHUB_REPOSITORY:-}"
      # MongoDB connection via internal Docker network only
      # Increased timeouts to tolerate slower container startup and transient network delays
      MONGO_URL: "mongodb://refract_user:refract_pass@mongo:27017/refract?authSource=admin&directConnection=true&serverSelectionTimeoutMS=120000&connectTimeoutMS=120000"
    volumes:
      # For local dev only - remove these volumes for production VPS deployment
      - .:/app:cached
      - meteor_node_modules:/app/node_modules
      - meteor_local:/app/.meteor/local
      - meteor_packages_cache:/root/.meteor/packages
      - meteor_package_metadata_cache:/root/.meteor/package-metadata
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - refract-internal

  mongo:
    image: mongo:5.0
    restart: unless-stopped
    # NO ports section = MongoDB not exposed to host or internet
    # Only accessible via internal Docker network
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_pass
      MONGO_APP_USER: "refract_user"
      MONGO_APP_PASS: "refract_pass"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks:
      - refract-internal

networks:
  refract-internal:
    driver: bridge
    internal: false # Set to true for completely isolated network (no internet access for containers)

volumes:
  mongo_data:
  meteor_node_modules:
  meteor_local:
  meteor_packages_cache:
  meteor_package_metadata_cache:
